name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # Stats Card - Light
      - name: Generate stats card - light
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=default&text_color=434d58&title_color=2f80ed
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Stats Card - Dark
      - name: Generate stats card - dark
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dark&bg_color=00000000&title_color=ffffff&text_color=ffffff
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Top Languages - Light
      - name: Generate top-langs card - light
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=7&theme=default&text_color=434d58&title_color=2f80ed
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Top Languages - Dark
      - name: Generate top-langs card - dark
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=7&theme=dark&bg_color=00000000&title_color=ffffff&text_color=ffffff
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push